[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modernbert-notes"
version = "0.1.0"
description = "CPU-runnable educational implementations of ModernBERT, a Laya-style decision head, and RLCD"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[dependency-groups]
docs = ["mkdocs-material>=9.6,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["modernbert_notes*"]
